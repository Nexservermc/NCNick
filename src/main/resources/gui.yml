# ============================================================
#  NCNick · 界面外观
#
#  本文件控制 GUI 的标题、填充等外观选项。
#
#  界面布局规则（所有界面统一）：
#    · 最外圈是灰色玻璃板边框
#    · 按钮沿中轴对称
#    · 返回在最后一行最左，关闭在最后一行最右
# ============================================================

# ------------------------------------------------------------
#  标题
# ------------------------------------------------------------
# 支持 & 颜色代码
titles:
  main: "&8昵称设置"
  color: "&8昵称颜色"
  input: "&8输入昵称"
  admin: "&8昵称管理"
  confirm: "&8确认操作"
  pay: "&8选择支付方式"

# ------------------------------------------------------------
#  输入提示
# ------------------------------------------------------------
input:
  # 玩家在聊天栏输入昵称时看到的占位提示
  placeholder: "<在此输入昵称>"

# ------------------------------------------------------------
#  外观
# ------------------------------------------------------------
appearance:
  # 是否用灰色玻璃板填充空白槽位（关闭后只显示按钮，更简洁）
  fill-empty: true

  # 边框材质：默认灰色玻璃板
  # 可选：BLACK / GRAY / WHITE / LIGHT_GRAY / BROWN 等染料色名
  # 留空则使用默认的 GRAY_STAINED_GLASS_PANE
  border-color: ""

# ------------------------------------------------------------
#  音效（可选）
# ------------------------------------------------------------
# 留空则不播放。使用 Bukkit 音效名，例如：
#   UI_BUTTON_CLICK / ENTITY_EXPERIENCE_ORB_PICKUP / BLOCK_NOTE_BLOCK_PLING
sounds:
  # 点击按钮
  click: "UI_BUTTON_CLICK"
  # 操作成功
  success: "ENTITY_PLAYER_LEVELUP"
  # 操作失败
  error: "ENTITY_VILLAGER_NO"
