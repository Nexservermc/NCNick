  reset-color-success: "&a已重置玩家 &e{player}&a 的暱稱顏色。"
  clear-success: "&a已清除玩家 &e{player}&a 的暱稱。"
  info-header: "&6===== &b玩家 &e{player}&6 的暱稱信息 ====="
  info-name: "&7真實 ID：&f{name}"
  info-uuid: "&7UUID：&f{uuid}"
  info-nickname: "&7暱稱：&r{nickname}"
  info-color: "&7顏色：&r{color}"
  info-mode: "&7來源：&f{mode}"
  info-updated: "&7更新時間：&f{time}"
  info-footer: "&6================================"
  force-download-start: "&e開始下載數據庫驅動 &f{driver}&e，請稍候……"
  force-download-ok: "&a驅動 &f{driver}&a 下載成功：&f{path}"
  force-download-fail: "&c驅動 &f{driver}&c 下載失敗：&f{reason}"
  force-download-all-ok: "&a全部驅動下載完成。"
  debug-on: "&a已開啟調試模式。"
  debug-off: "&c已關閉調試模式。"

# ---------- 幫助 ----------
help:
  header: "&6======== &bNCNick 中文暱稱 &6========"
