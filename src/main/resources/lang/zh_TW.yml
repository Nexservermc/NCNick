# ============================================================
#  NCNick 語言文件 —— 繁體中文 (zh_TW)
#
#  說明：
#    · 使用 & 作為顏色符號，支持 &0-&f、&k-&o 與 &#RRGGBB 真彩
#    · {xxx} 為佔位變量，請勿隨意刪除，否則對應內容會顯示為空
#    · 本文件可自由增刪條目；缺失的條目會自動回退到內置默認值
#    · 修改後執行 /nca reload 即可生效（無需重啟服務器）
# ============================================================

# ---------- 通用 ----------
prefix: "&7[&b暱稱&7]&r "

# ---------- 聊天欄輸入引導 ----------
# 玩家點擊「設定暱稱」後，在聊天欄輸入之前看到的引導文字。
# 注意：這裡必須用 & 顏色代碼，插件會自動轉換為顏色。
input:
  nickname-prompt: "&e請在聊天欄輸入你的暱稱"
  nickname-requirements: "&7要求：&f{min}-{max} &7個字元，全服唯一，不能含顏色代碼"
  nickname-color-hint: "&7顏色請設定完暱稱後使用 &e/nc color &7選擇"
  cancel-hint: "&7輸入 &ccancel &7取消"

# ---------- 提示消息 ----------
msg:
  no-permission: "&c你沒有權限執行此操作！"
  not-player: "&c該命令只能由玩家執行！"
  player-not-found: "&c找不到玩家 &e{player}&c！"
  player-offline: "&c玩家 &e{player}&c 當前不在線。"
  reloaded: "&a配置與語言文件已重載完成。"
  reload-failed: "&c重載失敗：&e{error}"
  gui-error: "&c界面打開失敗，請稍後重試或聯繫管理員。"
  unknown-command: "&c未知的子命令，請輸入 &e/{label} help &c查看幫助。"
  debug-toggled: "&a調試模式已{state}。"

# ---------- 暱稱校驗 ----------
validate:
  invalid-length: "&c暱稱長度需在 &e{min} &c- &e{max} &c個字符之間（當前 &e{length}&c）。"
  invalid-char: "&c暱稱中含有不允許的字符：&e{chars}"
  char-type-disabled: "&c暱稱中含有已禁用的字符類型：&e{types}"
  empty: "&c暱稱不能為空！"
  same-as-realname: "&c暱稱不能與你的真實 ID 相同！"
  duplicate: "&c暱稱 &e{nickname} &c已被其他玩家使用，請換一個！（全服唯一）"
  contains-color-code: "&c暱稱中不能包含顏色代碼，請使用顏色界面設置顏色。"
  input-placeholder-error: "&c請先刪除輸入框中的提示文字，再輸入暱稱！"
  blocked-word: "&c暱稱中包含被禁止的詞彙：&e{word}"
  not-set: "&c你還沒有設置暱稱。"
  target-not-set: "&c玩家 &e{player}&c 沒有設置暱稱。"

# ---------- 購買與付費 ----------
purchase:
  set-success: "&a暱稱已成功設置為 &r{display}&a！"
  free-success: "&a暱稱已成功設置為 &r{display}&a（權限免費）！"
  buy-success: "&a已扣除 &e{price}&a，暱稱購買成功！"
  not-enough-coins: "&c金幣不足！需要 &e{price} &c金幣，你當前只有 &e{balance}&c。"
  not-enough-points: "&c點券不足！需要 &e{price} &c點券，你當前只有 &e{balance}&c。"
  payment-failed: "&c扣費失敗，交易已取消，請稍後重試。"
  no-economy: "&c服務器未安裝經濟插件！需要 Vault（金幣）或 PlayerPoints（點券）。"
  mode-disabled: "&c暱稱購買功能當前未開放。"
  currency-disabled: "&c該支付方式當前不可用，請選擇其他方式。"
  cancelled: "&c已取消購買。"
  confirm-title: "&e確認購買"
  color-buy-success: "&a顏色 &r{color}&a 已應用到暱稱 &e{nickname}&a！"

# ---------- 暱稱刪除 ----------
remove:
  success: "&a已清除你的暱稱。"
  admin-success: "&a已清除玩家 &e{player}&a 的暱稱。"

# ---------- 管理員 ----------
admin:
  set-success: "&a已将玩家 &e{player}&a 的暱稱設置為 &r{nickname}&a。"
