  admin-list: "&e/nca list [頁碼] &7- 列出所有已設置暱稱的玩家"
  admin-driver: "&e/nca driver [status|download] &7- 數據庫驅動管理"
  admin-debug: "&e/nca debug [on|off] &7- 切換調試模式"
