  item-cancel: "&cCancel"
  item-back: "&eBack"
  item-reset: "&cReset to default color"
  item-reset-lore:
    - "&7Remove the custom color from your nickname"
  selected-from: "&7Start color: &r{color}"
  selected-to: "&7End color: &r{color}"
