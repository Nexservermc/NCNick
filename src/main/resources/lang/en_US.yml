    - "&7Smoothly fades from the start to the end color"
  item-preview: "&ePreview"
  item-preview-lore:
    - "&7Current: &r{color}"
    - "&7Click to see the actual effect"
  item-buy: "&aConfirm Purchase"
  item-buy-lore:
    - "&7Price: &e{price}"
    - "&7Balance: &e{balance}"
    - "&aClick to confirm the purchase"
  item-buy-lore-noperm:
