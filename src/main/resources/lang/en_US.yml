# ============================================================
#  NCNick Language File —— English (en_US)
#
#  Notes:
#    · & is the color code prefix; supports &0-&f, &k-&o and &#RRGGBB
#    · {xxx} are placeholders — do not remove them
#    · Entries may be added or removed freely; missing keys fall back
#      to the plugin's built-in defaults
#    · Run /nca reload to apply changes (no server restart needed)
# ============================================================

# ---------- General ----------
prefix: "&7[&bNick&7]&r "

# ---------- Chat input guidance ----------
# Shown before the player types their nickname in chat.
# Note: & colour codes are required here; the plugin converts them automatically.
input:
  nickname-prompt: "&ePlease type your nickname in chat"
  nickname-requirements: "&7Requirements: &f{min}-{max} &7characters, globally unique, no colour codes"
  nickname-color-hint: "&7Set the colour afterwards with &e/nc color"
  cancel-hint: "&7Type &ccancel &7to abort"

# ---------- Messages ----------
msg:
  no-permission: "&cYou do not have permission to do that!"
  not-player: "&cThis command can only be run by a player!"
  player-not-found: "&cPlayer &e{player}&c not found!"
  player-offline: "&cPlayer &e{player}&c is not online."
  reloaded: "&aConfiguration and language files reloaded."
  reload-failed: "&cReload failed: &e{error}"
  gui-error: "&cFailed to open the interface. Please try again later."
  unknown-command: "&cUnknown subcommand. Use &e/{label} help &cfor help."
  debug-toggled: "&aDebug mode {state}."

# ---------- Validation ----------
validate:
  invalid-length: "&cNickname must be &e{min} &cto &e{max} &ccharacters long (currently &e{length}&c)."
  invalid-char: "&cNickname contains disallowed characters: &e{chars}"
  char-type-disabled: "&cNickname contains a disabled character type: &e{types}"
  empty: "&cNickname cannot be empty!"
  same-as-realname: "&cNickname cannot be the same as your real ID!"
  duplicate: "&cNickname &e{nickname} &cis already taken by another player! (server-wide unique)"
  contains-color-code: "&cNicknames cannot contain color codes. Please use the color menu."
  input-placeholder-error: "&cPlease delete the placeholder text before typing your nickname!"
  blocked-word: "&cNickname contains a blocked word: &e{word}"
  not-set: "&cYou have not set a nickname yet."
  target-not-set: "&cPlayer &e{player}&c has not set a nickname."

# ---------- Purchase ----------
purchase:
  set-success: "&aNickname set to &r{display}&a!"
  free-success: "&aNickname set to &r{display}&a (free via permission)!"
  buy-success: "&aCharged &e{price}&a. Purchase successful!"
  not-enough-coins: "&cNot enough coins! Need &e{price} &cbut you only have &e{balance}&c."
  not-enough-points: "&cNot enough points! Need &e{price} &cbut you only have &e{balance}&c."
  payment-failed: "&cPayment failed. The transaction has been cancelled."
  no-economy: "&cNo economy plugin found! Vault (coins) or PlayerPoints (points) is required."
  mode-disabled: "&cNickname purchases are currently disabled."
  currency-disabled: "&cThat payment method is unavailable. Please choose another one."
  cancelled: "&cPurchase cancelled."
  confirm-title: "&eConfirm Purchase"
  color-buy-success: "&aColor &r{color}&a applied to nickname &e{nickname}&a!"

# ---------- Removal ----------
remove:
  success: "&aYour nickname has been cleared."
  admin-success: "&aCleared the nickname of &e{player}&a."

# ---------- Admin ----------
admin:
  set-success: "&aSet &e{player}&a's nickname to &r{nickname}&a."
  set-color-success: "&aSet &e{player}&a's nickname color to &r{color}&a."
  reset-color-success: "&aReset &e{player}&a's nickname color."
  clear-success: "&aCleared &e{player}&a's nickname."
  info-header: "&6===== &bNickname info for &e{player}&6 ====="
  info-name: "&7Real ID: &f{name}"
  info-uuid: "&7UUID: &f{uuid}"
  info-nickname: "&7Nickname: &r{nickname}"
  info-color: "&7Color: &r{color}"
  info-mode: "&7Source: &f{mode}"
  info-updated: "&7Updated: &f{time}"
  info-footer: "&6================================"
  force-download-start: "&eDownloading driver &f{driver}&e, please wait..."
  force-download-ok: "&aDriver &f{driver}&a downloaded to: &f{path}"
  force-download-fail: "&cFailed to download &f{driver}&c: &f{reason}"
  force-download-all-ok: "&aAll drivers have been downloaded."
  debug-on: "&aDebug mode enabled."
  debug-off: "&cDebug mode disabled."

# ---------- Help ----------
help:
  header: "&6======== &bNCNick &6========"
  entry-open: "&e/nc &7- Open the nickname menu"
  entry-set: "&e/nc set <nickname> &7- Set your nickname directly"
  entry-color: "&e/nc color &7- Open the color menu"
  entry-remove: "&e/nc remove &7- Clear your nickname"
  entry-info: "&e/nc info &7- View your nickname info"
  entry-help: "&e/nc help &7- Show this help"
  admin-header: "&6======== &bNCNick Admin Help &6========"
  admin-gui: "&e/nca &7- Open the player management menu"
  admin-set: "&e/nca set <player> <nickname> &7- Set a player's nickname"
  admin-color: "&e/nca color <player> <color> &7- Set nickname color (&7&/&#RRGGBB&7)"
  admin-resetcolor: "&e/nca resetcolor <player> &7- Reset nickname color"
  admin-clear: "&e/nca clear <player> &7- Clear a player's nickname"
  admin-info: "&e/nca info <player> &7- View a player's nickname details"
  admin-list: "&e/nca list [page] &7- List all nicknames"
  admin-driver: "&e/nca driver [status|download] &7- Manage database drivers"
  admin-debug: "&e/nca debug [on|off] &7- Toggle debug mode"
  admin-reload: "&e/nca reload &7- Reload config and language files"
  footer: "&6================================"

