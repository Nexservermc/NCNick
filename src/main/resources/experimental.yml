# ============================================================
#  NCNick · 实验性功能
#
#  ⚠️ 默认全部关闭。开启前请阅读下面的说明。
#
#  这些功能会**直接接管原版显示内容**（而不是新增一套并行显示），
#  目的是避免与 TAB、ProtocolLib 等显示类插件"各显示一套"。
#
#  三个开关可独立控制，每个还能单独选择显示模式，
#  另有总开关统一管理。
# ============================================================

# 总开关：关闭时，下方三个子开关全部失效
enabled: false

# ------------------------------------------------------------
#  显示模式（三个开关共用）
# ------------------------------------------------------------
#   name-nickname  ② 原ID + 自定义 → Steve#小明
#   full           ① 全自定义       → 小明
modes:
  tab: name-nickname
  nametag: name-nickname
  chat: name-nickname

# ------------------------------------------------------------
#  ① 原版 TAB 列表
# ------------------------------------------------------------
tab:
  enabled: false
  # 实现方式：player.setPlayerListName()
  # 此位置**没有**头顶那种平台限制，full 模式可真正只显示昵称

# ------------------------------------------------------------
#  ② 原版玩家头顶悬浮 ID
# ------------------------------------------------------------
nametag:
  enabled: false
  # 实现方式：记分板队伍前缀/后缀
  #
  # ⚠️ 平台限制（非本插件缺陷）：
  #    原版头顶名字 = 队伍前缀 + 玩家实体名 + 队伍后缀，
  #    其中「玩家实体名」无法通过 Bukkit 记分板 API 移除。
  #    因此：
  #      mode=name-nickname → 头顶显示 "Steve#小明"  ✅ 符合预期
  #      mode=full          → 头顶显示 "Steve小明"  ⚠ 原ID仍在
  #    若需要真正只显示昵称，请改用上面的 tab 接管。

# ------------------------------------------------------------
#  ③ 原版聊天栏
# ------------------------------------------------------------
chat:
  enabled: false
  # 实现方式：聊天事件格式替换
  # 1.19+ Paper 会自动适配 AsyncChatEvent（反射探测，失败静默降级）
  #
  # ⚠️ Paper 的 renderer 是单值字段，本插件设置的渲染器会覆盖
  #    其他插件写入的显示名。若你用了聊天格式化插件，建议二选一。

# ------------------------------------------------------------
#  数据包模式（预留）
# ------------------------------------------------------------
# 当前版本统一通过 Bukkit 原生 API 完成替换，不依赖 PacketEvents。
#   auto           自动（当前等同 none）
#   packetevents   指定用 PacketEvents（未安装时提示并继续用 API）
#   none           强制用原生 API
packet-mode: auto
