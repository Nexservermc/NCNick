# ============================================================
#  NCNick · 金融（价格与支付）
#
#  本文件控制「设置昵称/颜色要花多少钱、能用什么方式付」。
#
#  ⭐ 支付方式**按商品独立配置**：
#     purchase.nickname.currency  只影响「设置昵称」
#     purchase.color.currency     只影响「设置颜色」
#     两者互不干扰，可以一个只收金币、另一个同时收金币和点券。
#
#  依赖（可选）：
#    · Vault + 经济插件（XConomy / EssentialsX Economy 等）→ 金币
#    · PlayerPoints → 点券
#
#  权限豁免：
#    ncnick.free   免费设置（跳过付费）
#    ncnick.admin  管理员默认拥有免费权限
# ============================================================

# ============================================================
#  一、权限模式
# ============================================================
# 拥有指定权限的玩家可免费设置昵称（不需要付费）。
permission-mode:
  enabled: true
  # 免费设置所需的权限节点
  permission: "ncnick.use"
  # true = 权限被移除后，该玩家设置的昵称自动隐藏
  revoke-on-permission-lost: true

# ============================================================
#  二、购买模式
# ============================================================
purchase:
  enabled: true

  # 购买后是否可以再次修改（true = 每次修改都要重新付费）
  charge-on-modify: true

  # ----------------------------------------------------------
  #  设置昵称
  # ----------------------------------------------------------
  nickname:
    # 支付方式（**只影响昵称**）：
    #   coins  = 仅金币（Vault / XConomy）
    #   points = 仅点券（PlayerPoints）
    #   both   = 两种都支持，由玩家在 GUI 中自行选择
    currency: both

    price-coins: 10000
    price-points: 1000

    # 超长加价：超过指定字数后，按超出字数 × 单价累加
    extra-fee:
      enabled: true
      threshold: 5
      per-char-coins: 2000
      per-char-points: 200

  # ----------------------------------------------------------
  #  设置昵称颜色（纯色与渐变共用本段的 currency）
  # ----------------------------------------------------------
  color:
    # 支付方式（**只影响颜色**）：
    #   coins  = 仅金币
    #   points = 仅点券
    #   both   = 两种都支持
    #
    # 例：昵称只收金币、颜色只收点券 →
    #   nickname.currency: coins
    #   color.currency:    points
    currency: both

    # 纯色
    solid:
      price-coins: 5000
      price-points: 500

    # 渐变（默认比纯色更贵）
    gradient:
      price-coins: 15000
      price-points: 1500

# ============================================================
#  三、常见组合示例
# ============================================================
#  ① 全部用金币（不用点券）
#     nickname.currency: coins
#     color.currency:    coins
#
#  ② 昵称收金币，颜色收点券
#     nickname.currency: coins
#     color.currency:    points
#
#  ③ 昵称两种都行，颜色只收金币
#     nickname.currency: both
#     color.currency:    coins
#
#  ④ 玩家自选（推荐，默认）
#     nickname.currency: both
#     color.currency:    both
#
# 注意：若某种货币不可用（未装 Vault 或 PlayerPoints），
# 即使这里写了 coins/both，该选项也会自动隐藏，不会让玩家点了没反应。

# ============================================================
#  四、价格计算示例（默认配置）
# ============================================================
#   昵称"小明"（2 字）       → 10000 金币 / 1000 点券
#   昵称"一二三四五六"（6 字）→ 10000 + 1×2000 = 12000 金币
#   昵称"一二三四五六七"（7 字）→ 10000 + 2×2000 = 14000 金币
#
#   纯色 → 5000 金币 / 500 点券
#   渐变 → 15000 金币 / 1500 点券（比纯色贵 3 倍）
#
# 若希望渐变更便宜，直接改数字即可；插件启动时会检查并在
# 渐变价格低于纯色时给出提示。
