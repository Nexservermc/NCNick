# ============================================================
#  NCNick · 显示格式
#
#  本文件控制「昵称长什么样、显示在哪」。
#
#  ⚠️ 重要：本文件的 {name} / {nickname} / {prefix} 是**内部模板变量**，
#     由 NCNick 自己解析，只在本文件内有效。
#     若要在**其他插件**里读取昵称，请用 PlaceholderAPI 变量
#     %ncnick_nickname% 等（见 WIKI 第 10 章）。
# ============================================================

# ============================================================
#  一、占位符
# ============================================================
placeholder:
  # 自定义占位符字符串，在下面的格式中用 {prefix} 引用
  #
  # ⭐ 这个前缀的作用是**把昵称与正文区分开**：
  #     <小明> 你好       ← 不看 # 的话，分不清这是人名还是普通词语
  #     <#小明> 你好      ← # 清楚表明这是昵称
  #
  # 例："#" → Steve#小明 ；"·" → Steve·小明 ；"" → Steve小明（无分隔）
  #
  # 注意：PlaceholderAPI 的 %ncnick_nickname% 默认也会带上这个前缀。
  #       若你已在格式里手写了前缀，请改用 %ncnick_nickname_plain%。
  custom-prefix: "#"

  # 玩家没有昵称时，是否仍然显示 {prefix}
  # false（推荐）= 无昵称时前缀也不显示，避免出现 "Steve#" 这种残缺
  show-when-no-nickname: false

# ============================================================
#  二、三种显示位置的格式
# ============================================================
# 可用变量：
#   {name}      玩家真实 ID（如 Steve）
#   {nickname}  玩家昵称（含颜色）
#   {prefix}    custom-prefix 的值
#
# 两种占位符模式（需求 2）：
#   ① 仅自定义（默认）：#小明
#      tab: "{prefix}{nickname}"
#   ② 原ID+自定义：Steve#小明
#      tab: "{name}{prefix}{nickname}"
#
# ⚠️ 选②会让"真实 ID"和"昵称"同时出现（TAB 里就是 Steve#小明）。
#    如果你觉得这是"两个名字"，请用①。
format:
  # 聊天栏
  chat: "{prefix}{nickname}"

  # TAB 玩家列表
  #
  # 默认只显示昵称（#小明），不重复真实 ID。
  # 想让 TAB 显示成 Steve#小明，改成 "{name}{prefix}{nickname}"
  tab: "{prefix}{nickname}"

  # 玩家头顶悬浮名
  #
  # ⚠️ 平台限制：原版头顶 = 队伍前缀 + 玩家实体名 + 队伍后缀，
  #    中间那个「玩家实体名」无法通过 Bukkit 计分板 API 移除。
  #
  # ⚠️ 因此这里**千万不要**写 {name}：
  #    实体名本身就会显示，再写 {name} 就变成 "SteveSteve#小明"。
  #    只写 {prefix}{nickname}，最终头顶才是 "Steve#小明" 这种正常样子。
  nametag: "{prefix}{nickname}"

# ============================================================
#  三、其他显示选项
# ============================================================
options:
  # 是否给聊天栏的名字加粗
  bold-name: false

  # 聊天栏名字的包裹符号
  #
  # 说明：这里刻意不提供 name-wrapper 选项。
  # 聊天格式由服务端或聊天插件决定（通常是 <%1$s> %2$s），
  # NCNick 只替换其中的「玩家名占位符 %1$s」，不重写整个格式。
  # 若插件再套一层包裹符号，会出现 <#小明> 这类双重包裹。
