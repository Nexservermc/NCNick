# ============================================================
#  NCNick · 主配置
#  作者：xiaotian_xt / Nice_Leo_
#  兼容：Minecraft 1.8+（Spigot / Paper / 衍生核心）
#
#  本插件把配置按功能拆分为多个文件，便于维护：
#    config.yml          ← 你在这里（版本、语言、总开关）
#    validation.yml      昵称校验（字符集、长度、屏蔽词）
#    economy.yml         金融（价格、支付方式）
#    display.yml         显示格式（聊天/TAB/头顶/占位符）
#    storage.yml         存储与驱动下载
#    experimental.yml    实验性功能
#    gui.yml             界面外观
#    debug.yml           调试
#
#  所有文件都支持 /nca reload 热重载。
#  缺失的键会自动回退到插件内置默认值，不会因此报错。
# ============================================================

config-version: 2

# ============================================================
#  语言
# ============================================================
# 内置 30 种语言，语言文件位于 plugins/NCNick/lang/
#
#   【东亚】  zh_CN 简体中文   zh_TW 繁體中文   ja_JP 日本語   ko_KR 한국어
#   【东南亚】vi_VN Tiếng Việt  th_TH ไทย      id_ID Bahasa Indonesia
#   【中东】  ar_SA العربية    he_IL עברית     tr_TR Türkçe
#   【西欧】  en_US English    de_DE Deutsch   fr_FR Français
#             es_ES Español    it_IT Italiano  nl_NL Nederlands
#             pt_BR Português (Brasil)
#   【北欧】  sv_SE Svenska     da_DK Dansk     fi_FI Suomi      nb_NO Norsk
#   【中东欧】pl_PL Polski      cs_CZ Čeština   sk_SK Slovenčina hu_HU Magyar
#             ro_RO Română      bg_BG Български
#   【东欧】  ru_RU Русский     uk_UA Українська  el_GR Ελληνικά
#
# 也可自行新增：把 <代码>.yml 放进 lang/ 并在 LangManager.BUILTIN 登记
language: zh_CN

# ============================================================
#  功能总开关
# ============================================================
# 需要临时关闭某个功能时，把对应项设为 false 即可（无需删配置）。
features:
  # 昵称功能总开关（关闭后 /nc 提示功能已停用）
  nickname: true
  # 颜色功能总开关
  color: true
  # 购买功能总开关（关闭后只能通过权限免费设置）
  purchase: true

# ============================================================
#  冷却
# ============================================================
# 防止玩家频繁改名刷屏。拥有 ncnick.bypass.cooldown 可跳过。
cooldown:
  # 设置/修改昵称的冷却（秒），0 = 不限制
  nickname: 30
  # 设置颜色的冷却（秒），0 = 不限制
  color: 10
