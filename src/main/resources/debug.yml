# ============================================================
#  NCNick · 调试
#
#  默认全部关闭。排查问题时临时开启即可，排查完记得关掉。
#
#  也可以不改文件，直接用命令临时切换（仅本次运行有效）：
#     /nca debug on
#     /nca debug off
# ============================================================

# 调试总开关（关闭时零开销，所有分类日志都不会输出）
enabled: false

# ------------------------------------------------------------
#  细分开关（需 enabled 为 true 才生效）
# ------------------------------------------------------------
# 数据库 SQL 与存储相关
log-sql: false

# 昵称缓存读写
log-cache: false

# 数据包 / 聊天事件 / 实验性功能接管
log-packet: false

# 昵称校验过程（字符集、长度、唯一性）
log-validation: false

# ------------------------------------------------------------
#  日志噪音控制
# ------------------------------------------------------------
# 开启后，以下"过程性"信息才会出现在控制台：
#   · 已注册 PlaceholderAPI 变量
#   · 已适配 1.19+ 聊天事件
#   · 实验性功能替换方式
#   · 驱动预加载数量
#
# 关闭时（默认）这些只在 debug 级别输出，控制台保持清爽。
quiet-startup: true
