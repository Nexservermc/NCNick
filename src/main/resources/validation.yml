# ============================================================
#  NCNick · 昵称校验
#
#  本文件控制「什么样的昵称算合法」：
#    · 长度
#    · 可用字符集（默认简繁中文）
#    · 禁止字符 / 屏蔽词
#    · 全服唯一性
#
#  权限豁免（在 plugin.yml 中定义）：
#    ncnick.bypass.length    跳过长度限制
#    ncnick.bypass.charset   跳过字符集限制
#    ncnick.bypass.unique    跳过唯一性检查
#    ncnick.bypass.blocked   跳过屏蔽词检查
#    ncnick.bypass.*         全部豁免
# ============================================================

# ============================================================
#  一、长度与字符
# ============================================================
length:
  # 昵称长度（按可见字符计算，颜色代码不计入）
  min: 1
  max: 10

# ============================================================
#  二、可用字符集 —— 默认只允许中文（简体 + 繁体）
# ============================================================
# 每个类别可单独开关。全部关闭时字符集为空，
# 任何人都无法设置昵称，插件会在控制台输出警告。
#
# ranges 用 Unicode 区间描述，写法：
#   "\\u4E00-\\u9FFF"   CJK 统一汉字（基本区）
#   "a-zA-Z"            ASCII 字母
#   "0-9"               数字
#   "\\u00B7"           单个码点（间隔号 ·）
#   " ._-"              逐个字符
charset:
  # 简体中文（常用字 + 扩展）
  simplified-chinese:
    enabled: true
    ranges:
      - "\\u4E00-\\u9FFF"     # CJK 统一汉字（基本区）
      - "\\u3400-\\u4DBF"     # CJK 扩展 A
      - "\\uF900-\\uFAFF"     # CJK 兼容汉字
      - "\\u3000-\\u303F"     # CJK 标点（、。等）

  # 繁体中文（含扩展区，覆盖绝大多数繁体字）
  traditional-chinese:
    enabled: true
    ranges:
      - "\\u4E00-\\u9FFF"     # CJK 统一汉字（繁简共用区）
      - "\\u3400-\\u4DBF"     # CJK 扩展 A
      - "\\uF900-\\uFAFF"     # CJK 兼容汉字
      - "\\u3000-\\u303F"     # CJK 标点

  # 英文字母（默认关闭）
  latin:
    enabled: false
    ranges:
      - "a-zA-Z"

  # 数字（默认关闭）
  digits:
    enabled: false
    ranges:
      - "0-9"

  # 日文假名（默认关闭）
  kana:
    enabled: false
    ranges:
      - "\\u3040-\\u309F"     # 平假名
      - "\\u30A0-\\u30FF"     # 片假名

  # 韩文谚文（默认关闭）
  hangul:
    enabled: false
    ranges:
      - "\\uAC00-\\uD7AF"     # 谚文音节
      - "\\u1100-\\u11FF"     # 谚文字母

  # 符号与空格（默认关闭；开启后允许 空格 . _ - 等）
  symbols:
    enabled: false
    ranges:
      - " ._-"
      - "\\u00B7"             # 间隔号 ·

  # 自定义额外字符（始终生效，无论上面开关如何）
  # 直接填写想额外允许的字符，例如："☆★♡"
  extra-chars: ""

# ============================================================
#  三、禁止项
# ============================================================
forbidden:
  # 额外禁止的字符（黑名单，优先级高于上方允许列表）
  # 默认禁止：颜色代码符号、尖括号、引号、反斜杠、花括号等。
  # 花括号必须禁止：昵称中的 {} 会在消息占位符替换时被二次展开。
  chars: "&§<>\"'\\/|{}"

  # 禁止昵称中出现颜色代码（玩家必须通过颜色 GUI 设置颜色）
  # 注意：管理员用指令设置时不受此限制
  color-codes: true

  # 禁止昵称与真实 ID 相同
  same-as-realname: true

  # 屏蔽词（命中任意一个即拒绝，不区分大小写）
  # 只要昵称「包含」该词就会被拒绝，例如 "管理员" 会拦截 "我是管理员"
  blocked-words: []

# ============================================================
#  四、全服唯一
# ============================================================
uniqueness:
  # 开启后，昵称在全服唯一，不可重复
  enabled: true
  # 比较时是否忽略颜色代码（推荐开启：颜色不同但文字相同的昵称也算重复）
  ignore-color-codes: true
  # 比较时是否忽略大小写（对中文无影响，主要用于拉丁字母）
  ignore-case: true
  # 检查时是否忽略空格
  ignore-spaces: false

  # 说明：无论以上如何配置，插件都会做 Unicode 归一化
  # （NFKC + 剥离零宽/组合字符），这部分不可关闭，是防伪装的基础。
